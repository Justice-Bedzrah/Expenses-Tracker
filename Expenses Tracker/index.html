<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <div id="container">
        <h1>Expense Tracker</h1>
        <br>
        <form id="expense-form">
        <label for="expense-name">Expense Name:</label>
        <input type="text" id="expense-name" placeholder="Enter Expense Name"><br><br>
        <label for="expense-amount">Amount</label>
        <input type="number" id="expense-amount" placeholder="Enter Amount"><br><br>
        <label for="category-select">Select Expense Category:</label>
        <select  id="category-select">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
        </select><br>
        <button type="submit" class="submit-btn">Add Expense</button>
        </form><br>
        <br>
        <p>Total Spent: $<span id="total-spent">0.00</span></p>
        <div class="filter-bar">
            <label for="filter-category">
                Filter By Category:
            </label>
            <select  id="filter-category">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Utilities">Utilties</option>
                <option value="Entertainment">Entertainment</option>

            </select>
        </div>
        <ul id="expense-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
